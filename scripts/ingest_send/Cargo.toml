[package]
name = "ingest_send"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1"
futures = "0.3"
srt-protocol = { git = "https://github.com/maxolgi/srt-rs.git", branch = "main" }
srt-tokio = { git = "https://github.com/maxolgi/srt-rs.git", branch = "main" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
